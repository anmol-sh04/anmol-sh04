<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Anmol Sharma — Software Developer</title>
  <desc id="desc">A dark navy and violet gradient banner with abstract glowing rings and a software developer tagline.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#080d1c"/>
      <stop offset="55%" stop-color="#111a35"/>
      <stop offset="100%" stop-color="#241344"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity=".34"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#a5b4fc" stroke-opacity=".08" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="360" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="24" fill="url(#grid)"/>
  <circle cx="1020" cy="160" r="250" fill="url(#glow)"/>
  <circle cx="1010" cy="178" r="116" fill="none" stroke="url(#accent)" stroke-opacity=".45" stroke-width="1.5"/>
  <circle cx="1010" cy="178" r="82" fill="none" stroke="#a5b4fc" stroke-opacity=".3" stroke-width="1.5" stroke-dasharray="5 9"/>
  <circle cx="1010" cy="178" r="48" fill="#111a35" stroke="url(#accent)" stroke-width="2"/>
  <path d="M990 158L970 178L990 198M1030 158L1050 178L1030 198M1018 148L1002 208" fill="none" stroke="url(#accent)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="1110" cy="74" r="5" fill="#67e8f9"/>
  <circle cx="900" cy="270" r="4" fill="#c084fc"/>
  <circle cx="1090" cy="280" r="3" fill="#818cf8"/>
  <path d="M72 78H150" stroke="url(#accent)" stroke-width="4" stroke-linecap="round"/>
  <text x="72" y="150" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="62" font-weight="700" letter-spacing="-1.5">ANMOL SHARMA</text>
  <text x="76" y="198" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="23" letter-spacing="2">SOFTWARE DEVELOPER</text>
  <text x="76" y="252" fill="#a5b4fc" font-family="Segoe UI, Arial, sans-serif" font-size="19">MERN STACK  ·  JAVA DSA  ·  GENERATIVE AI</text>
  <text x="76" y="300" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="15">Building useful products. Learning by doing.</text>
</svg>